name: Ritm apply UI

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Застосувати найновіший zip у гілку ritm-ui
        run: |
          latest=""; latest_t=0
          for z in *.zip; do
            [ -f "$z" ] || continue
            t=$(git log -1 --format=%ct -- "$z")
            if [ "$t" -ge "$latest_t" ]; then latest="$z"; latest_t="$t"; fi
          done
          [ -n "$latest" ] || { echo "У корені немає .zip"; exit 1; }
          echo "Застосовую: $latest"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          unzip -o "$latest" -x ".github/*" "__MACOSX/*"
          rm -f ./*.zip
          git add -A
          git commit -m "Apply Ritm UI patch"
          git push origin HEAD:refs/heads/ritm-ui --force

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Прийняти ліцензії Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Збірка APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app_mojo:assembleFullDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ritm-ui-apk
          path: app_mojo/build/outputs/apk/**/*.apk
